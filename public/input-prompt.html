<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Details Required</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration (from project firebase-config)
        const firebaseConfig = {
            apiKey: "AIzaSyCodez48MockKeyForClientWindowConfig",
            authDomain: "codez48-automation.firebaseapp.com",
            projectId: "codez48-automation",
            storageBucket: "codez48-automation.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef123456"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Get URL Parameters
        const urlParams = new URLSearchParams(window.location.search);
        const runId = urlParams.get('runId') || 'demo_run';
        const promptLabel = urlParams.get('label') || 'Enter required value:';

        document.getElementById('prompt-label').innerText = promptLabel;

        // Auto-fill saved credentials if available in browser
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('codez48_saved_username') || '';
            const savedPass = localStorage.getItem('codez48_saved_password') || '';
            if (savedUser && document.getElementById('user-input')) {
                document.getElementById('user-input').value = savedUser;
            }
        });

        // Submit Action
        document.getElementById('send-btn').addEventListener('click', async () => {
            const inputVal = document.getElementById('user-input').value.trim();
            const statusEl = document.getElementById('status-msg');

            if (!inputVal) {
                statusEl.innerText = "Please enter a value before sending.";
                statusEl.classList.remove('hidden');
                return;
            }

            statusEl.innerText = "Transmitting to Firebase...";
            statusEl.classList.remove('hidden');
            document.getElementById('send-btn').disabled = true;

            try {
                // Transmit data via Firebase Firestore
                await updateDoc(doc(db, "automation_runs", runId), {
                    userResponse: inputVal,
                    status: "RESUMING",
                    updatedAt: new Date().toISOString()
                }).catch(async () => {
                    // Fallback to setDoc if doc doesn't exist
                    await setDoc(doc(db, "user_inputs", runId), {
                        runId,
                        inputValue: inputVal,
                        timestamp: new Date().toISOString()
                    });
                });

                statusEl.innerText = "Data transmitted via Firebase! Closing window...";

                // Save credential if checkbox checked
                if (document.getElementById('remember-cb')?.checked) {
                    localStorage.setItem('codez48_saved_username', inputVal);
                }

                setTimeout(() => {
                    // Properly close the window used for inputting details
                    window.close();
                }, 800);

            } catch (err) {
                console.error("Firebase Transmission Error:", err);
                statusEl.innerText = "Error: " + err.message;
            }
        });
    </script>
    <style>
        html, body {
            height: 200px;
            max-height: 200px;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f172a;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="flex items-center justify-center p-3">
    <div class="w-full max-w-md bg-slate-800/90 border border-slate-700 rounded-xl p-3 shadow-2xl flex flex-col justify-between h-[180px]">
        <div class="flex items-center justify-between border-b border-slate-700 pb-1.5">
            <span id="prompt-label" class="text-xs font-bold text-sky-400 truncate max-w-[280px]">Enter requested details:</span>
            <span class="text-[10px] font-mono bg-sky-950 text-sky-300 px-2 py-0.5 rounded border border-sky-800">200px Prompt Window</span>
        </div>

        <!-- Input Box & Button Perfectly Positioned -->
        <div class="flex items-center gap-2 my-2">
            <input type="text" id="user-input" placeholder="Type username, password, or personal detail..."
                   class="flex-1 bg-slate-900 border border-slate-600 focus:border-sky-500 text-white text-xs rounded-lg px-3 py-2 outline-none transition-all shadow-inner" autofocus />
            <button id="send-btn"
                    class="bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white text-xs font-black px-4 py-2 rounded-lg shadow-lg active:scale-95 transition-all">
                Send
            </button>
        </div>

        <div class="flex items-center justify-between text-[10px] text-slate-400">
            <label class="flex items-center gap-1 cursor-pointer">
                <input type="checkbox" id="remember-cb" class="rounded bg-slate-900 border-slate-700 text-sky-500 focus:ring-0 w-3 h-3" />
                <span>Save credential for auto-fill</span>
            </label>
            <p id="status-msg" class="hidden text-emerald-400 font-semibold truncate max-w-[180px]"></p>
        </div>
    </div>
</body>
</html>
