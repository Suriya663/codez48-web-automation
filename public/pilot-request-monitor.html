<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codez48 Pilot - Request Monitor & Diagnostics</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: #0b0f19; color: #f1f5f9; padding: 2rem; min-height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid #1e293b; padding-bottom: 1rem; }
        .title { font-size: 1.75rem; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 0.75rem; }
        .badge { background: #0284c7; color: #fff; font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 9999px; text-transform: uppercase; }
        .controls { display: flex; gap: 1rem; align-items: center; }
        .btn { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn:hover { background: #38bdf8; color: #0b0f19; }

        .debug-panel { background: #131c2e; border: 1px solid #334155; border-radius: 8px; padding: 1.25rem; margin-bottom: 2rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
        .debug-item { font-size: 0.85rem; color: #94a3b8; }
        .debug-item span { color: #38bdf8; font-weight: 600; display: block; margin-top: 0.25rem; }

        .requests-container { display: flex; flex-direction: column; gap: 1rem; }
        .request-card { background: #131c2e; border: 1px solid #1e293b; border-radius: 8px; padding: 1.25rem; transition: border-color 0.2s; }
        .request-card:hover { border-color: #38bdf8; }
        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
        .req-id { font-family: monospace; font-size: 0.95rem; color: #38bdf8; font-weight: 600; }
        .status-tag { padding: 0.25rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .status-COMPLETED, .status-LOCAL_EXECUTION_COMPLETED, .status-SENT_TO_PILOT { background: #064e3b; color: #34d399; }
        .status-AI_PROCESSING, .status-ANALYZING { background: #1e3a8a; color: #60a5fa; }
        .status-FAILED, .status-LOCAL_EXECUTION_FAILED { background: #7f1d1d; color: #f87171; }

        .field-group { margin-bottom: 0.5rem; font-size: 0.9rem; }
        .field-label { color: #64748b; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .field-val { color: #f8fafc; font-weight: 500; }
        .meta-row { display: flex; gap: 1.5rem; font-size: 0.8rem; color: #64748b; margin-top: 0.75rem; border-top: 1px solid #1e293b; padding-top: 0.75rem; }
        .meta-item span { color: #94a3b8; font-weight: 600; }
        .empty-state { text-align: center; padding: 4rem; color: #64748b; background: #131c2e; border-radius: 8px; border: 1px dashed #1e293b; }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">
            <span>Codez48 Pilot</span>
            <span class="badge">Request Monitor & Diagnostics</span>
        </div>
        <div class="controls">
            <button class="btn" onclick="fetchRequests()">Refresh Now</button>
        </div>
    </div>

    <div class="debug-panel" id="debugPanel">
        <div class="debug-item">Firebase: <span id="dbStatus">Connected</span></div>
        <div class="debug-item">Authentication: <span id="authStatus">Active Session</span></div>
        <div class="debug-item">Pilot Request: <span id="listenerStatus">Listening (Polling 5s)</span></div>
        <div class="debug-item">Latest Request ID: <span id="latestReqId">None</span></div>
        <div class="debug-item">Status: <span id="latestStatus">Idle</span></div>
        <div class="debug-item">Website: <span id="latestWebsite">None</span></div>
    </div>

    <div class="requests-container" id="requestsList">
        <div class="empty-state">Loading Pilot AI request telemetry...</div>
    </div>

    <script>
        async function fetchRequests() {
            try {
                const res = await fetch('/.netlify/functions/pilot-request-monitor');
                const data = await res.json();

                if (!data.success || !Array.isArray(data.requests)) {
                    document.getElementById('requestsList').innerHTML = '<div class="empty-state">No requests recorded yet. Run <code>codez48 pilot</code> to generate tasks.</div>';
                    return;
                }

                if (data.requests.length > 0) {
                    const latest = data.requests[0];
                    document.getElementById('latestReqId').innerText = latest.requestId;
                    document.getElementById('latestStatus').innerText = latest.status;
                    document.getElementById('latestWebsite').innerText = latest.website;
                }

                document.getElementById('requestsList').innerHTML = data.requests.map(r => `
                    <div class="request-card">
                        <div class="card-top">
                            <span class="req-id">Request ID: ${r.requestId}</span>
                            <span class="status-tag status-${r.status}">${r.status}</span>
                        </div>
                        <div class="field-group">
                            <div class="field-label">Website</div>
                            <div class="field-val"><a href="${r.website}" target="_blank" style="color: #38bdf8; text-decoration: none;">${r.website}</a></div>
                        </div>
                        <div class="field-group" style="margin-top: 0.5rem;">
                            <div class="field-label">Original Task</div>
                            <div class="field-val">${escapeHtml(r.originalGoal || r.promptPreview)}</div>
                        </div>
                        <div class="field-group" style="margin-top: 0.5rem;">
                            <div class="field-label">Target</div>
                            <div class="field-val" style="color: #34d399;">${escapeHtml(r.target || 'Semantic auto-resolve')}</div>
                        </div>
                        <div class="meta-row">
                            <div class="meta-item">Created: <span>${new Date(r.timestamp).toLocaleString()}</span></div>
                            <div class="meta-item">Updated: <span>${r.updatedAt ? new Date(r.updatedAt).toLocaleString() : 'Live'}</span></div>
                        </div>
                    </div>
                `).join('');

            } catch (e) {
                console.error("Fetch monitor failed:", e);
                document.getElementById('dbStatus').innerText = 'Disconnected / Error';
                document.getElementById('requestsList').innerHTML = '<div class="empty-state">Unable to load monitor data. Check Netlify function endpoint.</div>';
            }
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        fetchRequests();
        setInterval(fetchRequests, 5000);
    </script>
</body>
</html>
