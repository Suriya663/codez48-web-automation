[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/preview/:id"
  to = "/.netlify/functions/preview-website?id=:id"
  status = 200

[[redirects]]
  from = "/enterprise"
  to = "/Enterprise/index.html"
  status = 200

[[redirects]]
  from = "/enterprise/*"
  to = "/Enterprise/:splat"
  status = 200

[[redirects]]
  from = "/Enterprise"
  to = "/Enterprise/index.html"
  status = 200

[[redirects]]
  from = "/download"
  to = "/download/index.html"
  status = 200

[[redirects]]
  from = "/download/"
  to = "/download/index.html"
  status = 200

[[redirects]]
  from = "/download/Codez48Pilot.apk"
  to = "/download/Codez48Pilot.apk"
  status = 200

[[redirects]]
  from = "/Codez48Pilot.apk"
  to = "/Codez48Pilot.apk"
  status = 200

[[headers]]
  for = "/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"Codez48Pilot.apk\""
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/download/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"Codez48Pilot.apk\""
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
