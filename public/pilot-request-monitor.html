<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codez48 Pilot - AI Request Monitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: #0b0f19; color: #f1f5f9; padding: 2rem; min-height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid #1e293b; padding-bottom: 1rem; }
        .title { font-size: 1.75rem; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 0.75rem; }
        .badge { background: #0284c7; color: #fff; font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 9999px; text-transform: uppercase; }
        .controls { display: flex; gap: 1rem; align-items: center; }
        .btn { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn:hover { background: #38bdf8; color: #0b0f19; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: #131c2e; border: 1px solid #1e293b; border-radius: 8px; padding: 1.25rem; }
        .stat-val { font-size: 1.8rem; font-weight: 700; color: #f8fafc; margin-top: 0.25rem; }
        .stat-label { font-size: 0.85rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }
        .requests-container { display: flex; flex-direction: column; gap: 1rem; }
        .request-card { background: #131c2e; border: 1px solid #1e293b; border-radius: 8px; padding: 1.25rem; transition: border-color 0.2s; }
        .request-card:hover { border-color: #38bdf8; }
        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
        .req-id { font-family: monospace; font-size: 0.95rem; color: #38bdf8; font-weight: 600; }
        .status-tag { padding: 0.25rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .status-COMPLETED, .status-LOCAL_EXECUTION_COMPLETED { background: #064e3b; color: #34d399; }
        .status-SENT_TO_PILOT, .status-AI_PROCESSING { background: #1e3a8a; color: #60a5fa; }
        .status-FAILED, .status-LOCAL_EXECUTION_FAILED { background: #7f1d1d; color: #f87171; }
        .prompt-preview { font-size: 0.95rem; color: #cbd5e1; margin-bottom: 0.75rem; line-height: 1.5; background: #0b0f19; padding: 0.75rem; border-radius: 6px; border: 1px solid #1e293b; }
        .meta-row { display: flex; gap: 1.5rem; font-size: 0.8rem; color: #64748b; }
        .meta-item span { color: #94a3b8; font-weight: 600; }
        .empty-state { text-align: center; padding: 4rem; color: #64748b; background: #131c2e; border-radius: 8px; border: 1px dashed #1e293b; }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">
            <span>Codez48 Pilot</span>
            <span class="badge">Request Monitor</span>
        </div>
        <div class="controls">
            <button class="btn" onclick="fetchRequests()">Refresh Now</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">Total Requests</div>
            <div class="stat-val" id="totalCount">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Sent to Pilot</div>
            <div class="stat-val" id="sentCount" style="color: #60a5fa;">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Execution Completed</div>
            <div class="stat-val" id="completedCount" style="color: #34d399;">0</div>
        </div>
    </div>

    <div class="requests-container" id="requestsList">
        <div class="empty-state">Loading Pilot AI request telemetry...</div>
    </div>

    <script>
        async function fetchRequests() {
            try {
                const res = await fetch('/.netlify/functions/pilot-request-monitor');
                const data = await res.json();

                if (!data.success || !Array.isArray(data.requests)) {
                    document.getElementById('requestsList').innerHTML = '<div class="empty-state">No requests recorded yet. Run <code>codez48 pilot</code> to generate tasks.</div>';
                    return;
                }

                document.getElementById('totalCount').innerText = data.totalRequests || 0;

                let sent = 0;
                let completed = 0;
                data.requests.forEach(r => {
                    if (r.status.includes('COMPLETED')) completed++;
                    else sent++;
                });
                document.getElementById('sentCount').innerText = sent;
                document.getElementById('completedCount').innerText = completed;

                if (data.requests.length === 0) {
                    document.getElementById('requestsList').innerHTML = '<div class="empty-state">No requests recorded yet. Run <code>codez48 pilot</code> to generate tasks.</div>';
                    return;
                }

                document.getElementById('requestsList').innerHTML = data.requests.map(r => `
                    <div class="request-card">
                        <div class="card-top">
                            <span class="req-id">${r.requestId}</span>
                            <span class="status-tag status-${r.status}">${r.status}</span>
                        </div>
                        <div class="prompt-preview">${escapeHtml(r.promptPreview || 'No prompt content')}</div>
                        <div class="meta-row">
                            <div class="meta-item">Task Type: <span>${r.taskType}</span></div>
                            <div class="meta-item">App: <span>${r.application}</span></div>
                            <div class="meta-item">Response Size: <span>${r.responseLength} bytes</span></div>
                            <div class="meta-item">Artifacts: <span>${r.artifactsCount}</span></div>
                            <div class="meta-item">Time: <span>${new Date(r.timestamp).toLocaleTimeString()}</span></div>
                        </div>
                    </div>
                `).join('');

            } catch (e) {
                console.error("Fetch monitor failed:", e);
                document.getElementById('requestsList').innerHTML = '<div class="empty-state">Unable to load monitor data. Check Netlify function endpoint.</div>';
            }
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Auto-refresh every 5 seconds
        fetchRequests();
        setInterval(fetchRequests, 5000);
    </script>
</body>
</html>
