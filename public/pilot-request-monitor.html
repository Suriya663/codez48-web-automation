<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codez48 Pilot - Real-Time Visual Computer Control Screen & Selectable OCR</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: #020408; color: #f1f5f9; width: 100vw; height: 100vh; overflow: hidden; position: relative; }

        /* Full-screen viewport dominating the entire screen */
        .viewport-screen { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; background: #000; overflow: hidden; }
        .screenshot-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .screenshot-img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }

        /* Target overlay elements */
        .overlay-layer { position: absolute; pointer-events: none; }
        .target-ring { position: absolute; width: 32px; height: 32px; border: 2.5px solid #38bdf8; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 10px #38bdf8; animation: ringPulse 1.5s infinite; z-index: 10; }
        @keyframes ringPulse { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.7; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
        .bounding-rect { position: absolute; border: 2px dashed #34d399; background: rgba(52, 211, 153, 0.12); border-radius: 3px; z-index: 5; }
        .target-label { position: absolute; background: rgba(15, 23, 42, 0.9); border: 1px solid #38bdf8; color: #38bdf8; font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; transform: translate(-50%, -130%); white-space: nowrap; font-family: monospace; font-weight: 600; z-index: 15; }

        /* Interactive Selectable OCR Text Overlays (பதிவு செய்யப்பட்ட உரೆಯನ್ನು தேர்ந்தெடுக்க மற்றும் நகலெடுக்க) */
        .ocr-selectable-text {
            position: absolute;
            color: transparent;
            user-select: text;
            cursor: text;
            white-space: nowrap;
            z-index: 8;
        }
        .ocr-selectable-text::selection {
            background: rgba(56, 189, 248, 0.4);
            color: #ffffff;
        }

        /* Compact Floating Response Panel */
        .response-panel { position: absolute; top: 1.25rem; right: 1.25rem; background: rgba(15, 23, 42, 0.88); border: 1px solid #334155; backdrop-filter: blur(10px); padding: 0.85rem 1.15rem; border-radius: 8px; font-size: 0.85rem; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,0.6); min-width: 220px; }
        .response-panel .panel-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; margin-bottom: 0.35rem; font-weight: 700; border-bottom: 1px solid #1e293b; padding-bottom: 0.25rem; }
        .response-panel div { margin-bottom: 0.25rem; display: flex; justify-content: space-between; gap: 1rem; }
        .response-panel span { color: #38bdf8; font-weight: 600; font-family: monospace; }
        .status-val { color: #34d399 !important; font-weight: 700 !important; text-transform: uppercase; }

        /* Minimal Discrete Diagnostics Trigger */
        .diag-trigger { position: absolute; bottom: 1.25rem; right: 1.25rem; background: rgba(15, 23, 42, 0.8); border: 1px solid #334155; color: #94a3b8; padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; z-index: 50; transition: all 0.2s; }
        .diag-trigger:hover { background: #38bdf8; color: #020408; border-color: #38bdf8; }

        /* Collapsible Diagnostics Drawer */
        .diag-drawer { position: absolute; bottom: 0; right: 0; width: 450px; height: 100vh; background: #0b0f19; border-left: 1px solid #1e293b; z-index: 100; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: -10px 0 30px rgba(0,0,0,0.8); }
        .diag-drawer.open { transform: translateX(0); }
        .drawer-header { padding: 1rem 1.25rem; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; font-weight: 600; color: #38bdf8; background: #060911; }
        .drawer-body { flex: 1; overflow-y: auto; padding: 1.25rem; font-size: 0.8rem; color: #94a3b8; }
        .close-drawer { background: none; border: none; color: #94a3b8; font-size: 1.25rem; cursor: pointer; }
        .close-drawer:hover { color: #f1f5f9; }

        .debug-section { background: #131c2e; border: 1px solid #1e293b; border-radius: 6px; padding: 0.85rem; margin-bottom: 1rem; font-family: monospace; font-size: 0.75rem; }
        .debug-section h4 { color: #38bdf8; margin-bottom: 0.35rem; font-size: 0.8rem; }
        .request-card { background: #131c2e; border: 1px solid #1e293b; border-radius: 6px; padding: 0.75rem; margin-bottom: 0.75rem; cursor: pointer; }
        .request-card:hover { border-color: #38bdf8; }
        .req-top { display: flex; justify-content: space-between; margin-bottom: 0.4rem; font-family: monospace; font-size: 0.8rem; color: #38bdf8; }
        .empty-state { text-align: center; padding: 2rem; color: #64748b; }
    </style>
</head>
<body>
    <div class="viewport-screen" id="viewportScreen">
        <!-- Compact Floating Response Panel -->
        <div class="response-panel" id="responsePanel">
            <div class="panel-title">Current Event / Response</div>
            <div><span>Target:</span> <span id="respTarget">business</span></div>
            <div><span>Source X:</span> <span id="respX">--</span></div>
            <div><span>Source Y:</span> <span id="respY">--</span></div>
            <div><span>Confidence:</span> <span id="respConf">--</span></div>
            <div><span>Status:</span> <span id="respStatus" class="status-val">OBSERVING</span></div>
        </div>

        <!-- Full Viewport Screenshot & Overlay -->
        <div class="screenshot-container" id="screenshotContainer">
            <img id="liveScreenshot" class="screenshot-img" alt="Live Windows Screenshot" />
            <div class="overlay-layer" id="overlayLayer"></div>
        </div>

        <!-- Discrete Diagnostics Trigger -->
        <button class="diag-trigger" onclick="toggleDiagnostics()">Diagnostics</button>

        <!-- Collapsible Diagnostics Drawer -->
        <div class="diag-drawer" id="diagDrawer">
            <div class="drawer-header">
                <span>Technical Diagnostics & Visual Debug</span>
                <button class="close-drawer" onclick="toggleDiagnostics()">&times;</button>
            </div>
            <div class="drawer-body" id="drawerBody">
                <div class="debug-section" id="visualDebugSection">
                    <h4>Visual Debug Mode (Robust Target Disambiguation Active)</h4>
                    <div id="debugContent">Scanning screenshot pixels for target...</div>
                </div>
                <div id="panelContent">
                    <div class="empty-state">Waiting for telemetry...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Include Tesseract.js CDN for robust browser-side direct image OCR fallback & selectable text -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script>
        // ==========================================
        // தமிழ் குறிப்புகள் (Tamil Explanatory Notes):
        // 1. Firebase இலிருந்து திரைப்பிடிப்பு (Screenshot) பெறப்படுகிறது.
        // 2. Tesseract.js மூலம் படத்தில் உள்ள எழுத்துக்கள் (OCR) துல்லியமாக படிக்கப்படுகின்றன.
        // 3. உலாவி தலைப்பு பகுதி (Browser Chrome) மற்றும் தேவையற்ற சின்னங்கள் (Symbols like ®) வடிகட்டப்படுகின்றன.
        // 4. சரியான இலக்கு எழுத்து ("business") கண்டறியப்பட்டு சரியான X, Y ஆயத்தொலைவுகள் சுட்டி இயக்கத்திற்கு அனுப்பப்படுகின்றன.
        // ==========================================

        window.visualRequestsCache = [];
        let activeRequestId = null;
        let activeScreenshotLength = 0;

        function toggleDiagnostics() {
            document.getElementById('diagDrawer').classList.toggle('open');
        }

        async function fetchRequests() {
            const fallbackRequest = {
                requestId: 'LOCAL-FALLBACK-' + Date.now(),
                type: 'SCREEN_ANALYSIS',
                status: 'COMPLETED',
                screenshotWidth: 1280,
                screenshotHeight: 800,
                screenshotData: (() => {
                    const c = document.createElement('canvas');
                    c.width = 1280;
                    c.height = 800;
                    const x = c.getContext('2d');
                    x.fillStyle = '#0f172a';
                    x.fillRect(0, 0, 1280, 800);
                    x.fillStyle = '#38bdf8';
                    x.font = 'bold 36px sans-serif';
                    x.fillText('Codez48 Pilot Automation Monitor', 80, 120);
                    x.fillStyle = '#34d399';
                    x.font = 'bold 28px sans-serif';
                    x.fillText('Waiting for remote Firebase telemetry...', 80, 200);
                    x.fillStyle = '#ffffff';
                    x.font = '24px monospace';
                    x.fillText('Target Element: Business', 80, 300);
                    return c.toDataURL('image/jpeg', 0.9);
                })(),
                targetElement: 'Business',
                createdAt: new Date().toISOString(),
                elements: [
                    { label: 'Business', box: { left: 80, top: 260, right: 350, bottom: 320 }, confidence: 0.99 }
                ]
            };

            let remoteRequests = [];

            try {
                const res = await fetch('/.netlify/functions/pilot-request-monitor');
                const data = await res.json();

                if (data.success && data.payload) {
                    remoteRequests = [data.payload];
                } else if (data.success && Array.isArray(data.visualRequests)) {
                    remoteRequests = data.visualRequests;
                }
            } catch (err) {
                console.log("[FIREBASE SYNC] Waiting for remote telemetry stream...");
            }

            let localQueue = [];
            try {
                localQueue = JSON.parse(localStorage.getItem('codez48_local_requests') || '[]');
            } catch (err) {}

            const combined = [...remoteRequests, ...localQueue];
            if (combined.length === 0) {
                combined.push(fallbackRequest);
            }

            window.visualRequestsCache = combined;
            const latest = window.visualRequestsCache[0];

            const currentScreenshotLength = latest.screenshotData ? latest.screenshotData.length : 0;
            if (!activeRequestId || activeRequestId !== latest.requestId || currentScreenshotLength !== activeScreenshotLength) {
                activeRequestId = latest.requestId;
                activeScreenshotLength = currentScreenshotLength;
                await processActiveRequest(latest);
            }

            renderDiagnosticsDrawer();
        }

        async function processActiveRequest(vr) {
            const img = document.getElementById('liveScreenshot');
            let src = vr.screenshotData;
            if (src) {
                if (!src.startsWith('data:') && !src.startsWith('http')) {
                    src = 'data:image/jpeg;base64,' + src;
                }
            } else {
                src = 'https://placehold.co/1280x800/0f172a/38bdf8?text=Waiting+for+Firebase+Screenshot...';
            }

            // Remove any previous event listeners to prevent double-firing
            img.onload = null;
            img.onerror = null;
            let overlayTriggered = false;

            const triggerOverlay = async () => {
                if (overlayTriggered) return;
                overlayTriggered = true;
                console.log('[FIREBASE IMAGE LOADED] Screenshot rendered successfully.');
                await analyzeAndOverlay(vr);
            };

            img.onload = triggerOverlay;

            img.onerror = () => {
                console.warn('[IMAGE LOAD ERROR] Firebase screenshot load failed. Using placeholder.');
                img.src = 'https://placehold.co/1280x800/0f172a/38bdf8?text=Firebase+Image+Load+Error';
            };

            img.src = src;
            if (img.complete && img.naturalWidth > 0) {
                triggerOverlay();
            }
        }

        const ocrCache = {};
        let isOcrBusy = false;

        async function analyzeAndOverlay(vr) {
            const img = document.getElementById('liveScreenshot');
            const overlay = document.getElementById('overlayLayer');
            overlay.innerHTML = '';

            const sourceWidth = vr.screenshotWidth || img.naturalWidth || 1280;
            const sourceHeight = vr.screenshotHeight || img.naturalHeight || 800;

            if (!sourceWidth || !sourceHeight) return;

            let allWords = [];

            // 1. Check OCR Cache or execute Tesseract safely without worker collisions
            if (vr.requestId && ocrCache[vr.requestId]) {
                allWords = ocrCache[vr.requestId];
            } else if (!isOcrBusy && img.src && img.src.startsWith('data:image/') && img.naturalWidth > 10 && img.naturalHeight > 10) {
                isOcrBusy = true;
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth || sourceWidth;
                    canvas.height = img.naturalHeight || sourceHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);

                    const result = await Tesseract.recognize(canvas, 'eng').catch(() => null);
                    if (result && result.data && result.data.words) {
                        allWords = result.data.words;
                        if (vr.requestId) ocrCache[vr.requestId] = allWords;
                    }
                } catch (err) {
                    console.warn('[TESSERACT OCR WARNING]', err ? (err.message || err) : 'OCR scan skipped');
                } finally {
                    isOcrBusy = false;
                }
            }

            const container = document.getElementById('screenshotContainer');
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;

            const scale = Math.min(
                containerWidth / sourceWidth,
                containerHeight / sourceHeight
            );

            const renderedW = sourceWidth * scale;
            const renderedH = sourceHeight * scale;
            const imageOffsetX = (containerWidth - renderedW) / 2;
            const imageOffsetY = (containerHeight - renderedH) / 2;

            overlay.style.left = `${imageOffsetX}px`;
            overlay.style.top = `${imageOffsetY}px`;
            overlay.style.width = `${renderedW}px`;
            overlay.style.height = `${renderedH}px`;

            // Render interactive copyable spans for ALL valid detected OCR words
            allWords.forEach(w => {
                if (w.bbox.y0 > 50 && w.text && w.text.trim().length > 0) {
                    const span = document.createElement('span');
                    span.className = 'ocr-selectable-text';
                    span.innerText = w.text + ' ';
                    span.style.left = `${w.bbox.x0 * scale}px`;
                    span.style.top = `${w.bbox.y0 * scale}px`;
                    span.style.fontSize = `${(w.bbox.y1 - w.bbox.y0) * scale * 0.85}px`;
                    overlay.appendChild(span);
                }
            });

            // Filter target matches
            const targetQuery = (vr.targetElement || 'business').toLowerCase().trim().replace(/[^\w]/g, '');
            const matches = allWords.filter(w => {
                const text = (w.text || '').toLowerCase().trim().replace(/[^\w]/g, '');
                if (w.bbox.y0 < 60 && w.bbox.x0 < 100) return false;
                if (text.length < 2) return false;
                return text.includes(targetQuery) || targetQuery.includes(text);
            });

            matches.sort((a, b) => a.bbox.y0 - b.bbox.y0);

            const elements = matches.length > 0 ? matches.map(w => ({
                label: w.text,
                box: { left: w.bbox.x0, top: w.bbox.y0, right: w.bbox.x1, bottom: w.bbox.y1 },
                confidence: w.confidence / 100.0,
                sourceType: 'IMAGE_OCR'
            })) : (vr.elements || []).filter(el => !(el.box && el.box.top < 60 && el.box.left < 100));

            // Render Grounded Target Identity Overlay if present from AI Telemetry
            if (vr.groundedPayload && vr.groundedPayload.targetIdentity && vr.groundedPayload.targetIdentity.rect) {
                const ti = vr.groundedPayload.targetIdentity;
                const rectBox = ti.rect;
                if (rectBox.width > 0 && rectBox.height > 0) {
                    const gLeft = rectBox.x * scale;
                    const gTop = rectBox.y * scale;
                    const gWidth = rectBox.width * scale;
                    const gHeight = rectBox.height * scale;
                    const gCenterX = ti.viewportX * scale;
                    const gCenterY = ti.viewportY * scale;

                    const gRect = document.createElement('div');
                    gRect.className = 'bounding-rect';
                    gRect.style.borderColor = '#10b981';
                    gRect.style.boxShadow = '0 0 15px rgba(16, 185, 129, 0.8)';
                    gRect.style.left = `${gLeft}px`;
                    gRect.style.top = `${gTop}px`;
                    gRect.style.width = `${gWidth}px`;
                    gRect.style.height = `${gHeight}px`;
                    overlay.appendChild(gRect);

                    const gRing = document.createElement('div');
                    gRing.className = 'target-ring';
                    gRing.style.borderColor = '#10b981';
                    gRing.style.left = `${gCenterX}px`;
                    gRing.style.top = `${gCenterY}px`;
                    overlay.appendChild(gRing);

                    const gLbl = document.createElement('div');
                    gLbl.className = 'target-label';
                    gLbl.style.background = 'rgba(16, 185, 129, 0.9)';
                    gLbl.style.color = '#ffffff';
                    gLbl.style.left = `${gCenterX}px`;
                    gLbl.style.top = `${Math.max(0, gTop - 25)}px`;
                    gLbl.innerText = `GROUNDED: ${ti.text || ti.role} (X:${ti.viewportX}, Y:${ti.viewportY})`;
                    overlay.appendChild(gLbl);
                }
            }

            if (elements.length > 0) {
                const el = elements[0];
                const box = el.box || { left: 0, top: 0, right: 0, bottom: 0 };
                const sourceLeft = box.left;
                const sourceTop = box.top;
                const sourceRight = box.right;
                const sourceBottom = box.bottom;

                const displayLeft = sourceLeft * scale;
                const displayTop = sourceTop * scale;
                const displayWidth = (sourceRight - sourceLeft) * scale;
                const displayHeight = (sourceBottom - sourceTop) * scale;

                const sourceCenterX = Math.round((sourceLeft + sourceRight) / 2);
                const sourceCenterY = Math.round((sourceTop + sourceBottom) / 2);

                const displayCenterX = sourceCenterX * scale;
                const displayCenterY = sourceCenterY * scale;

                const rect = document.createElement('div');
                rect.className = 'bounding-rect';
                rect.style.left = `${displayLeft}px`;
                rect.style.top = `${displayTop}px`;
                rect.style.width = `${displayWidth}px`;
                rect.style.height = `${displayHeight}px`;
                overlay.appendChild(rect);

                const ring = document.createElement('div');
                ring.className = 'target-ring';
                ring.style.left = `${displayCenterX}px`;
                ring.style.top = `${displayCenterY}px`;
                overlay.appendChild(ring);

                const lbl = document.createElement('div');
                lbl.className = 'target-label';
                lbl.style.left = `${displayCenterX}px`;
                lbl.style.top = `${displayTop}px`;
                lbl.innerText = `${el.label || 'Target'} (X: ${sourceCenterX}, Y: ${sourceCenterY})`;
                overlay.appendChild(lbl);

                document.getElementById('respTarget').innerText = el.label || 'business';
                document.getElementById('respX').innerText = sourceCenterX;
                document.getElementById('respY').innerText = sourceCenterY;
                document.getElementById('respConf').innerText = `${((el.confidence || 0.98) * 100).toFixed(1)}%`;
                document.getElementById('respStatus').innerText = 'TARGET DETECTED';

                document.getElementById('debugContent').innerHTML = `
                    <div>Source Dimensions: ${sourceWidth} x ${sourceHeight}</div>
                    <div>Source Box: [L:${sourceLeft}, T:${sourceTop}, R:${sourceRight}, B:${sourceBottom}]</div>
                    <div>Source Center (X, Y): X=${sourceCenterX}, Y=${sourceCenterY}</div>
                    <div>Scale: ${scale.toFixed(4)}</div>
                    <div>Rendered Size: ${Math.round(renderedW)} x ${Math.round(renderedH)}</div>
                    <div>Image Offset: X=${Math.round(imageOffsetX)}, Y=${Math.round(imageOffsetY)}</div>
                    <div>Display Box: [L:${Math.round(displayLeft)}, T:${Math.round(displayTop)}, R:${Math.round(displayLeft+displayWidth)}, B:${Math.round(displayTop+displayHeight)}]</div>
                    <div>Display Center: X=${Math.round(displayCenterX)}, Y=${Math.round(displayCenterY)}</div>
                    <div>Source Type: ${el.sourceType || 'IMAGE_OCR'}</div>
                    <div>Filtered Words: ${allWords.length} total, ${matches.length} matches</div>
                `;
            } else {
                document.getElementById('respTarget').innerText = vr.targetElement || 'Observing Page';
                document.getElementById('respStatus').innerText = 'OBSERVING';
            }
        }

        async function sendCursorRequest(payload) {
            try {
                console.log('[CURSOR REQUEST SENT]', payload);
                const reqBody = JSON.stringify({
                    ...payload,
                    domContent: document.documentElement.outerHTML.substring(0, 50000),
                    status: 'CURSOR_REQUESTED'
                });

                // The local proxy (monitor.js) handles forwarding this cleanly to the local CLI telemetry server
                const res = await fetch('/.netlify/functions/pilot-request-monitor', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: reqBody
                });

                if (!res.ok) throw new Error("Server responded with status " + res.status);
                const data = await res.json();
                console.log('[CURSOR RESPONSE RECEIVED]', data);
            } catch (e) {
                console.warn('[LOCAL QUEUE FALLBACK] Request simulated locally:', e.message);
                const localReq = {
                    requestId: payload.requestId || 'REQ-' + Date.now(),
                    type: payload.type || 'CURSOR_TARGET',
                    status: 'CURSOR_REQUESTED',
                    screenshotWidth: 1280,
                    screenshotHeight: 800,
                    screenshotData: document.getElementById('liveScreenshot')?.src || '',
                    targetElement: payload.targetText || 'Business',
                    createdAt: new Date().toISOString(),
                    elements: [{ label: payload.targetText || 'Business', box: { left: payload.sourceLeft || 100, top: payload.sourceTop || 100, right: payload.sourceRight || 300, bottom: payload.sourceBottom || 150 }, confidence: 0.99 }]
                };
                let queue = [];
                try { queue = JSON.parse(localStorage.getItem('codez48_local_requests') || '[]'); } catch (err) {}
                queue.unshift(localReq);
                if (queue.length > 20) queue = queue.slice(0, 20);
                localStorage.setItem('codez48_local_requests', JSON.stringify(queue));
            }
        }

        function renderDiagnosticsDrawer() {
            document.getElementById('panelContent').innerHTML = visualRequestsCache.map(vr => `
                <div class="request-card" onclick="selectRequest('${vr.requestId}')">
                    <div class="req-top">
                        <span>${vr.requestId}</span>
                        <span style="color: #34d399;">${vr.status || 'COMPLETED'}</span>
                    </div>
                    <div>Source Dimensions: ${vr.screenshotWidth} x ${vr.screenshotHeight} px</div>
                    <div>OCR Blocks: ${vr.ocrCount || 0} | UI Elements: ${vr.elementsCount || 0}</div>
                    <div style="font-size: 0.75rem; color: #64748b; margin-top: 0.25rem;">${new Date(vr.createdAt).toLocaleString()}</div>
                </div>
            `).join('');
        }

        function selectRequest(reqId) {
            const found = visualRequestsCache.find(v => v.requestId === reqId);
            if (found) {
                activeRequestId = found.requestId;
                processActiveRequest(found);
                toggleDiagnostics();
            }
        }

        window.addEventListener('resize', () => {
            const vr = visualRequestsCache.find(v => v.requestId === activeRequestId);
            if (vr) analyzeAndOverlay(vr);
        });

        // Auto-Trigger Screenshot & Firebase Request on Page Load
        async function triggerInitialScreenCapture() {
            try {
                console.log('[AUTO-TRIGGER] Capturing screen state and sending request to Firebase...');
                const canvas = document.createElement('canvas');
                canvas.width = 1280;
                canvas.height = 800;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#38bdf8';
                ctx.font = 'bold 32px sans-serif';
                ctx.fillText('Codez48 Pilot Automation Monitor - Active View', 60, 100);
                ctx.fillStyle = '#34d399';
                ctx.font = '20px monospace';
                ctx.fillText('Target: Start Button & Input Field Verification', 60, 160);

                const screenshotData = canvas.toDataURL('image/jpeg', 0.85);
                const domContent = document.documentElement.outerHTML.substring(0, 50000);

                const reqBody = JSON.stringify({
                    requestId: 'AUTO-SCREEN-' + Date.now(),
                    type: 'SCREEN_ANALYSIS',
                    status: 'PENDING_VERIFICATION',
                    screenshotWidth: 1280,
                    screenshotHeight: 800,
                    screenshotData: screenshotData,
                    domContent: domContent,
                    targetElement: 'Start',
                    originalGoal: 'Verify Start button and input fields',
                    createdAt: new Date().toISOString()
                });

                // The local proxy (monitor.js) handles forwarding this cleanly to the local CLI telemetry server
                await fetch('/.netlify/functions/pilot-request-monitor', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: reqBody
                });

                console.log('[AUTO-TRIGGER] Request sent successfully.');
            } catch (e) {
                console.warn('[AUTO-TRIGGER FAILED]:', e.message);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            triggerInitialScreenCapture();
        });

        fetchRequests();
        setInterval(fetchRequests, 500);
    </script>

    <!-- Direct Real-Time Firebase Firestore Live Sync -->
    <script type="module">
        import { db, auth } from '../js/firebase-config.js';
        import { collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        import { signInAnonymously } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        async function initRealtimeFirebaseMonitor() {
            try {
                await signInAnonymously(auth);
                console.log("[FIREBASE REALTIME MONITOR] Authenticated anonymously to Firestore.");

                const q = query(collection(db, "visual_analysis_requests"), orderBy("createdAt", "desc"), limit(10));
                onSnapshot(q, (snapshot) => {
                    const reqs = [];
                    snapshot.forEach(doc => {
                        const d = doc.data();
                        reqs.push({
                            requestId: d.requestId || doc.id,
                            type: d.type || 'SCREEN_ANALYSIS',
                            status: d.status || 'COMPLETED',
                            screenshotWidth: d.screenshotWidth || 1280,
                            screenshotHeight: 800,
                            screenshotData: d.screenshotData || null,
                            domContent: d.domContent || '',
                            targetElement: d.targetElement || d.originalGoal || 'Business',
                            createdAt: d.createdAt || new Date().toISOString(),
                            ocr: d.ocr || [],
                            elements: d.elements || []
                        });
                    });

                    if (reqs.length > 0) {
                        window.visualRequestsCache = reqs;
                        const latest = window.visualRequestsCache[0];
                        if (!activeRequestId || activeRequestId !== latest.requestId || (latest.screenshotData && activeScreenshotLength !== latest.screenshotData.length)) {
                            activeRequestId = latest.requestId;
                            activeScreenshotLength = latest.screenshotData ? latest.screenshotData.length : 0;
                            processActiveRequest(latest);
                        }
                        renderDiagnosticsDrawer();
                    }
                }, (err) => {
                    console.warn("[FIREBASE SNAPSHOT WARN]:", err.message);
                });
            } catch (e) {
                console.warn("[FIREBASE MONITOR INIT WARN]:", e.message);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initRealtimeFirebaseMonitor();
        });
    </script>
