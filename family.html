<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codez48 Family & User Activity Hub — Operations Lead: Gopi</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
        }
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .text-royal { color: #2563EB; }
        .bg-royal { background-color: #2563EB; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-blue-600 selection:text-white">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 sm:gap-3 cursor-pointer min-w-0" onclick="location.href='/index.html'">
                <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-purple-600 flex items-center justify-center font-black text-lg sm:text-xl text-white shadow-lg shadow-blue-500/20 shrink-0">
                    C
                </div>
                <div class="min-w-0">
                    <h1 class="font-extrabold text-sm sm:text-base tracking-wide text-white flex items-center gap-1.5 sm:gap-2 truncate">
                        CODEZ48 <span class="text-[9px] sm:text-[10px] bg-blue-500/20 text-blue-400 border border-blue-500/30 px-1.5 sm:px-2 py-0.5 rounded-full font-mono uppercase">Family & Analytics</span>
                    </h1>
                    <p class="text-[10px] sm:text-[11px] text-slate-400 hidden sm:block truncate">Operations Lead: Gopi • 5-Day Activity Profiler</p>
                </div>
            </div>
            <div class="flex items-center gap-2 sm:gap-4 shrink-0">
                <button onclick="location.href='/tools/index.html'" class="text-[11px] sm:text-xs font-bold text-slate-400 hover:text-white transition flex items-center gap-1 bg-slate-800/60 sm:bg-transparent px-2.5 py-1.5 sm:p-0 rounded-lg">
                    <i class="fa-solid fa-arrow-left"></i> <span class="hidden sm:inline">Back to Tools Hub</span><span class="sm:hidden">Back</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-8 sm:py-10">
        <div id="family-analytics-container">
            <!-- Rendered by family-analytics.js -->
        </div>
    </main>

    <footer class="border-t border-slate-900 bg-slate-950 py-6 text-center text-xs text-slate-500">
        <p>Codez48 Pilot Family & Analytics Engine • Managed by Gopi • Rolling 5-Day Profile</p>
    </footer>

    <script src="./js/family-analytics.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.familyAnalytics) {
                window.familyAnalytics.renderFamilySection('family-analytics-container');
            }
        });
    </script>
</body>
</html>
